<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List with LocalStorage</title>
    <style>
        body {
            background-color: pink;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            align-items: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        button {
            background-color: lightcoral;
            border-radius: 50px;
            font-size: 20px;
            padding: 12px 25px;
            width: auto;
            min-width: 150px;
            cursor: pointer;
            border: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover {
            transform: scale(1.05);
        }

        .demo {
            background-color: beige;
            border-radius: 50px;
            font-size: 20px;
            padding: 15px 25px;
            margin: 15px auto;
            width: 80%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .demo p {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            word-break: break-word;
            flex: 1;
        }

        .delete-btn {
            background-color: red;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .delete-btn:hover {
            transform: scale(1.1);
        }

        #demos {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .buttons {
                gap: 15px;
            }

            button {
                font-size: 16px;
                padding: 10px 20px;
                min-width: 120px;
            }

            .demo {
                width: 90%;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="buttons">
        <button id="C">➕ Create</button>
        <button id="D">🗑️ Delete All</button>
        <button id="A">📋 Access</button>
    </div>

    <div id="demos"></div>
</body>

</body>
<script>let todos = []; // Yeh array saare todos store karega

    // 🔥 Todo ko screen pe dikhane ka function
    function displayTodos() {
        let container = document.getElementById("demos");
        container.innerHTML = ""; // Pehle saaf karo

        for (let i = 0; i < todos.length; i++) {
            let todoDiv = document.createElement("div");
            todoDiv.classList.add("demo");

            let textPara = document.createElement("p");
            textPara.innerText = todos[i];

            let deleteBtn = document.createElement("button");
            deleteBtn.innerText = "❌";
            deleteBtn.classList.add("delete-btn");

            // Delete button ka kaam
            deleteBtn.addEventListener("click", function () {
                todos.splice(i, 1); // Array se hatao
                localStorage.setItem("myTodos", JSON.stringify(todos)); // Update localStorage
                displayTodos(); // Screen dobara dikhao
            });

            todoDiv.appendChild(textPara);
            todoDiv.appendChild(deleteBtn);
            container.appendChild(todoDiv);
        }
    }

    // 🔥 Naya todo add karne ka function
    function addTodo() {
        let newTodo = prompt("Enter your todo:");
        if (newTodo && newTodo.trim() !== "") {
            todos.push(newTodo);
            localStorage.setItem("myTodos", JSON.stringify(todos));
            displayTodos();
        }
    }

    // 🔥 Saare todos delete karne ka function
    function deleteAllTodos() {
        if (confirm("Are you sure you want to delete all todos?")) {
            todos = [];
            localStorage.setItem("myTodos", JSON.stringify(todos));
            displayTodos();
        }
    }

    // 🔥 Access todos (bas screen pe dikha dega — pehle se dikh rahe hain)
    function accessTodos() {
        alert("You have " + todos.length + " todos in your list.");
    }

    // 🔥 Page load hone pe LocalStorage se data lao
    window.addEventListener("load", function () {
        let savedTodos = localStorage.getItem("myTodos");
        if (savedTodos) {
            todos = JSON.parse(savedTodos);
            displayTodos();
        }
    });

    // Buttons ke event listeners
    document.getElementById("C").addEventListener("click", addTodo);
    document.getElementById("D").addEventListener("click", deleteAllTodos);
    document.getElementById("A").addEventListener("click", accessTodos);</script>

</html>
